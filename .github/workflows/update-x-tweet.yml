name: Update featured X tweet

on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch: {} # allow manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-x-tweet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh featured tweet from RSS
        env:
          # Uses the repo secret X_RSS_FEED if set, else this default feed.
          X_RSS_FEED: ${{ secrets.X_RSS_FEED || 'https://rss.app/feeds/miD5EeEjrXbD2ifB.xml' }}
          X_HANDLE: _Vaastavikata
        run: python .github/scripts/update_tweet.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: refresh featured X tweet"
            git push
          else
            echo "No change to index.html."
          fi
